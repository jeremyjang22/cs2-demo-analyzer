# fly launch --no-deploy will rewrite app/primary_region; everything else here
# is deliberate.
app = "cs2-demo-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero between requests. Parsing jobs will need this revisited -
  # a worker that sleeps does not drain its queue - but for an API that only
  # answers logins it keeps the bill near nothing.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
