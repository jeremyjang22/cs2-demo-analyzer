version: "2"
sql:
  - engine: postgresql
    schema: schema/schema.sql
    queries: queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        # steamid is a uint64 in the demo data but fits in a signed bigint
        # (max steamid is well under 2^63), so the default int64 mapping is
        # correct - just remember to convert at the edges.
        emit_json_tags: true
        emit_pointers_for_null_types: true
